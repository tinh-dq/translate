<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            position: relative;
        }
        .copy-btn {
            display: none;
            position: absolute;
            top: 5px;
            right: 5px;
            cursor: pointer;
        }
        td:hover .copy-btn {
            display: block;
        }
    </style>
</head>
<body>

<h1>Language Translation Table</h1>
<table id="translationTable">
    <thead>
        <tr>
            <th>User Input</th>
            <th>Vietnamese</th>
            <th>English</th>
            <th>Korean</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td><input type="text" oninput="translate(this)" placeholder="Enter text..."></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    </tbody>
</table>
<button onclick="addRow()">Add Row</button>

<script>
    async function translate(input) {
        const row = input.parentElement.parentElement;
        const text = input.value;

        if (text) {
            const languages = ['vi', 'en', 'ko'];
            for (let lang of languages) {
                const translatedText = await fetchTranslation(text, lang);
                row.cells[1 + languages.indexOf(lang)].innerText = translatedText;
            }
        } else {
            row.cells[1].innerText = '';
            row.cells[2].innerText = '';
            row.cells[3].innerText = '';
        }
    }

    async function fetchTranslation(text, targetLang) {
        const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await response.json();
        return data[0][0][0];
    }

    function addRow() {
        const tableBody = document.getElementById('translationTable').getElementsByTagName('tbody')[0];
        const newRow = tableBody.insertRow();
        const inputCell = newRow.insertCell(0);
        const langCells = [newRow.insertCell(1), newRow.insertCell(2), newRow.insertCell(3)];

        inputCell.innerHTML = '<input type="text" oninput="translate(this)" placeholder="Enter text...">';
        langCells.forEach(cell => {
            cell.innerHTML = '<span class="copy-btn" onclick="copyToClipboard(this)">Copy</span>';
        });
    }

    function copyToClipboard(button) {
        const cell = button.parentElement;
        const textToCopy = cell.innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert('Copied to clipboard: ' + textToCopy);
        });
    }
</script>

</body>
</html>
