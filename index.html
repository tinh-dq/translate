<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translation Table</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f3f4f6;
      }
      .container {
        min-width: 80%;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
        width: 24%;
      }
      td.relative {
        position: relative;
      }
      th {
        background-color: #f0f0f0;
      }
      td > textarea {
        width: 100%;
        height: 100%;
        border: none;
        resize: vertical;
      }
      .copy-btn {
        display: none;
        position: absolute;
        top: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.3);
        color: white;
        border: none;
        padding: 5px;
        cursor: pointer;
        border-radius: 4px;
      }
      td.relative:hover .copy-btn {
        display: block;
      }
      .add-row-btn {
        margin-top: 10px;
        padding: 8px 16px;
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Translation Table</h1>
      <table>
        <thead>
          <tr>
            <th>Input</th>
            <th>Vietnamese</th>
            <th>English</th>
            <th>Korean</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td>
              <textarea
                oninput="debounceTranslate(this)"
                placeholder="Input text here"
              ></textarea>
            </td>
            <td class="relative">
              <span class="translated"></span
              ><button class="copy-btn" onclick="copyText(this)">Copy</button>
            </td>
            <td class="relative">
              <span class="translated"></span
              ><button class="copy-btn" onclick="copyText(this)">Copy</button>
            </td>
            <td class="relative">
              <span class="translated"></span
              ><button class="copy-btn" onclick="copyText(this)">Copy</button>
            </td>
          </tr>
        </tbody>
      </table>
      <button class="add-row-btn" onclick="addRow()">Add Row</button>
    </div>

    <script>
      let debounceTimeout;
      function autoResize(textarea) {
        textarea.style.height = "auto"; // Reset height
        textarea.style.height = textarea.scrollHeight + "px"; // Set new height
      }

      function debounceTranslate(input) {
        autoResize(input);
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(() => translateText(input), 1000);
      }

      async function translateText(input) {
        const text = input.value.trim();
        if (!text) return;

        const paragraphs = splitTextIntoParagraphs(text);
        const row = input.closest("tr");
        const targetLangs = ["vi", "en", "ko"];
        const translatedCells = row.querySelectorAll(".translated");

        for (let i = 0; i < targetLangs.length; i++) {
          translatedCells[i].textContent = "Translating...";
          let translateHtml = "<p>";
          for (let j = 0; j < paragraphs.length; j++) {
            try {
              const translateTextArray = await fetchTranslation(
                paragraphs[j],
                targetLangs[i]
              );
              translateHtml += `${translateTextArray.join(" ")}</br>`;
            } catch (error) {
              console.log(error);
            }
          }
          translateHtml += "</p>";
          translatedCells[i].innerHTML = translateHtml;
        }
      }

      function splitTextIntoParagraphs(text) {
        const paragraphs = text.split(/\n/); // Tách đoạn văn bằng dấu xuống dòng
        const newParagraphs = paragraphs.map((para) => {
          const sentences = [];
          let sentenceStart = 0;

          for (let i = 0; i < para.length; i++) {
            if (
              [".", "!", "?"].includes(para[i]) &&
              (i === para.length - 1 || para[i + 1] === " ")
            ) {
              sentences.push(para.slice(sentenceStart, i + 1).trim());
              sentenceStart = i + 2; // Bỏ qua dấu cách sau dấu câu (nếu có)
            }
          }

          if (sentenceStart < para.length) {
            sentences.push(para.slice(sentenceStart).trim()); // Thêm câu cuối cùng nếu còn sót
          }

          return sentences;
        });

        return newParagraphs;
      }

      async function fetchTranslation(sentences, targetLang) {
        const translations = await Promise.all(
          sentences.map(async (sentence) => {
            console.log(sentence);
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(
              sentence
            )}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error("API error");
            const result = await response.json();
            return result[0][0][0] || "Translation failed";
          })
        );
        return translations;
      }

      function addRow() {
        const tableBody = document.getElementById("tableBody");
        const newRow = document.createElement("tr");
        newRow.innerHTML = `
                <td><textarea oninput="debounceTranslate(this)"></textarea></td>
                <td class="relative"><span class="translated"></span><button class="copy-btn" onclick="copyText(this)">Copy</button></td>
                <td class="relative"><span class="translated"></span><button class="copy-btn" onclick="copyText(this)">Copy</button></td>
                <td class="relative"><span class="translated"></span><button class="copy-btn" onclick="copyText(this)">Copy</button></td>
            `;
        tableBody.appendChild(newRow);
      }

      function copyText(button) {
        const text = button.previousElementSibling.innerHTML;
        if (text) {
          navigator.clipboard
            .writeText(text)
            .then(() => {
              button.textContent = "Copied!";
              setTimeout(() => (button.textContent = "Copy"), 1000);
            })
            .catch((err) => {
              console.error("Failed to copy: ", err);
              alert("Failed to copy text. Please try again.");
            });
        } else {
          alert("No text to copy.");
        }
      }
    </script>
  </body>
</html>
