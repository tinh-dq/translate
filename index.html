<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translation Table</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f3f4f6;
      }
      .container {
        width: 80%;
        max-width: 800px;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      td.relative {
        position: relative;
      }
      th {
        background-color: #f0f0f0;
      }
      td input {
        width: 97%;
      }
      .copy-btn {
        display: none;
        position: absolute;
        top: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.3);
        color: white;
        border: none;
        padding: 5px;
        cursor: pointer;
        border-radius: 4px;
      }
      td.relative:hover .copy-btn {
        display: block;
      }
      .add-row-btn {
        margin-top: 10px;
        padding: 8px 16px;
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Translation Table</h1>
      <table>
        <thead>
          <tr>
            <th>Input</th>
            <th>Vietnamese</th>
            <th>English</th>
            <th>Korean</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td><input type="text" oninput="debounceTranslate(this)" /></td>
            <td class="relative">
              <span class="translated"></span
              ><button class="copy-btn" onclick="copyText(this)">Copy</button>
            </td>
            <td class="relative">
              <span class="translated"></span
              ><button class="copy-btn" onclick="copyText(this)">Copy</button>
            </td>
            <td class="relative">
              <span class="translated"></span
              ><button class="copy-btn" onclick="copyText(this)">Copy</button>
            </td>
          </tr>
        </tbody>
      </table>
      <button class="add-row-btn" onclick="addRow()">Add Row</button>
    </div>

    <script>
      let debounceTimeout;

      function debounceTranslate(input) {
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(() => translateText(input), 1000);
      }

      async function translateText(input) {
        const text = input.value.trim();
        if (!text) return;

        const row = input.closest("tr");
        const targetLangs = ["vi", "en", "ko"];
        const translatedCells = row.querySelectorAll(".translated");

        for (let i = 0; i < targetLangs.length; i++) {
          translatedCells[i].textContent = "Translating...";
          try {
            const translatedText = await fetchTranslation(text, targetLangs[i]);
            translatedCells[i].textContent = translatedText;
          } catch (error) {
            translatedCells[i].textContent = "Error!";
          }
        }
      }

      async function fetchTranslation(text, targetLang) {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(
          text
        )}`;
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error("API error");
          const result = await response.json();
          return result[0][0][0] || "Translation failed";
        } catch (error) {
          return "Error";
        }
      }

      function addRow() {
        const tableBody = document.getElementById("tableBody");
        const newRow = document.createElement("tr");
        newRow.innerHTML = `
                <td><input type="text" oninput="debounceTranslate(this)"></td>
                <td class="relative"><span class="translated"></span><button class="copy-btn" onclick="copyText(this)">Copy</button></td>
                <td class="relative"><span class="translated"></span><button class="copy-btn" onclick="copyText(this)">Copy</button></td>
                <td class="relative"><span class="translated"></span><button class="copy-btn" onclick="copyText(this)">Copy</button></td>
            `;
        tableBody.appendChild(newRow);
      }

      function copyText(button) {
        const text = button.previousElementSibling.textContent;
        if (text) {
          navigator.clipboard
            .writeText(text)
            .then(() => {
              button.textContent = "Copied!";
              setTimeout(() => (button.textContent = "Copy"), 1000);
            })
            .catch((err) => {
              console.error("Failed to copy: ", err);
              alert("Failed to copy text. Please try again.");
            });
        } else {
          alert("No text to copy.");
        }
      }
    </script>
  </body>
</html>
